upstream belog_backend {
    include /etc/nginx/conf.d/belog-upstream.inc;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    return 444;
}

server {
    listen 80;
    server_name __BELOG_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__BELOG_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __BELOG_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__BELOG_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__BELOG_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location ^~ /swagger-ui {
        auth_basic "Belog API Docs";
        auth_basic_user_file /etc/nginx/conf.d/swagger.htpasswd;
        proxy_pass http://belog_backend;
    }

    location ^~ /v3/api-docs {
        auth_basic "Belog API Docs";
        auth_basic_user_file /etc/nginx/conf.d/swagger.htpasswd;
        proxy_pass http://belog_backend;
    }

    location / {
        proxy_pass http://belog_backend;
    }
}
