x-belog-app: &belog-app
  restart: unless-stopped
  env_file:
    - ${BELOG_ENV_FILE:-./.env.dev}
  environment:
    SPRING_PROFILES_ACTIVE: ${BELOG_SPRING_PROFILE:-dev}
    SERVER_PORT: 8080
  networks:
    - belog-network

services:
  blue:
    <<: *belog-app
    image: ${BELOG_BLUE_IMAGE:-belog-server:unconfigured}
    container_name: belog-blue
    ports:
      - "127.0.0.1:8081:8080"
    labels:
      belog.environment: blue
      belog.image: ${BELOG_BLUE_IMAGE:-belog-server:unconfigured}

  green:
    <<: *belog-app
    image: ${BELOG_GREEN_IMAGE:-belog-server:unconfigured}
    container_name: belog-green
    ports:
      - "127.0.0.1:8082:8080"
    labels:
      belog.environment: green
      belog.image: ${BELOG_GREEN_IMAGE:-belog-server:unconfigured}

  nginx:
    image: nginx:1.28-alpine
    container_name: belog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - belog-network

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: belog-alloy
    restart: unless-stopped
    profiles:
      - monitoring
    env_file:
      - ${BELOG_ALLOY_ENV_FILE:-./.env.alloy}
    environment:
      BELOG_ENVIRONMENT: ${BELOG_SPRING_PROFILE:-dev}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - belog-network

volumes:
  alloy-data:

networks:
  belog-network:
    name: belog-network
