name: CD (development)

on:
  push:
    branches:
      - develop

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to development
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      spring-profile: dev
    secrets: inherit
