name: Rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Roll back production to the previous Blue/Green environment
        required: true
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:리
  rollback:
    name: Roll back production
    if: inputs.confirm
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      REMOTE_ROLLBACK_SCRIPT: /tmp/belog-rollback-${{ github.run_id }}.sh

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Configure SSH
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/belog-rollback-key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/belog-rollback-key" "$HOME/.ssh/known_hosts"

      - name: Upload rollback script
        run: |
          scp \
            -i "$HOME/.ssh/belog-rollback-key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy/rollback.sh \
            "$EC2_USER@$EC2_HOST:$REMOTE_ROLLBACK_SCRIPT"

      - name: Roll back to previous environment
        run: |
          ssh \
            -i "$HOME/.ssh/belog-rollback-key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "chmod 700 '$REMOTE_ROLLBACK_SCRIPT' && '$REMOTE_ROLLBACK_SCRIPT'"

      - name: Remove temporary SSH key and script
        if: always()
        run: |
          ssh \
            -i "$HOME/.ssh/belog-rollback-key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "rm -f '$REMOTE_ROLLBACK_SCRIPT'" \
            || true
          rm -f "$HOME/.ssh/belog-rollback-key"
