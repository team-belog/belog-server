spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: "${SERVER_PORT:8080}"
  forward-headers-strategy: framework
