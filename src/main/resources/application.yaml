spring:
  application:
    name: belog
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

  web:
    error:
      include-exception: false
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  shutdown: graceful

app:
  security:
    account-number:
      encryption-key: "${ACCOUNT_NUMBER_ENCRYPTION_KEY}"

auth:
  google:
    client-id: "${GOOGLE_CLIENT_ID}"
    client-secret: "${GOOGLE_CLIENT_SECRET}"
    redirect-uris: "${GOOGLE_REDIRECT_URIS}"
  jwt:
    secret: "${JWT_SECRET}"
    issuer: belog
    access-token-expiration: 30m
    refresh-token-expiration: 14d
    refresh-cookie-secure: "${REFRESH_COOKIE_SECURE:true}"
    refresh-cookie-same-site: "${REFRESH_COOKIE_SAME_SITE:Lax}"

storage:
  s3:
    bucket: "${AWS_S3_BUCKET}"
    region: "${AWS_REGION:ap-northeast-2}"
    presign-expiration: 5m
    connection-timeout: "${AWS_S3_CONNECTION_TIMEOUT:2s}"
    socket-timeout: "${AWS_S3_SOCKET_TIMEOUT:5s}"
    api-call-attempt-timeout: "${AWS_S3_API_CALL_ATTEMPT_TIMEOUT:5s}"
    api-call-timeout: "${AWS_S3_API_CALL_TIMEOUT:10s}"

group:
  invite:
    base-url: "${GROUP_INVITE_BASE_URL}"

post-log:
  photo-verification:
    max-concurrent-head-requests: "${POST_LOG_PHOTO_MAX_CONCURRENT_HEAD_REQUESTS:10}"
    queue-capacity: "${POST_LOG_PHOTO_VERIFICATION_QUEUE_CAPACITY:100}"
    timeout: "${POST_LOG_PHOTO_VERIFICATION_TIMEOUT:15s}"

ocr:
  upstage:
    base-url: "${UPSTAGE_BASE_URL:https://api.upstage.ai/v1/information-extraction}"
    api-key: "${UPSTAGE_API_KEY}"
    model: "${UPSTAGE_MODEL:information-extract}"
    mode: "${UPSTAGE_EXTRACTION_MODE:standard}"
    connection-timeout: "${UPSTAGE_CONNECTION_TIMEOUT:3s}"
    read-timeout: "${UPSTAGE_READ_TIMEOUT:60s}"
