spring:
  application:
    name: belog
  jpa:
    open-in-view: false

  web:
    error:
      include-exception: false
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  shutdown: graceful

app:
  security:
    account-number:
      encryption-key: "${ACCOUNT_NUMBER_ENCRYPTION_KEY}"

auth:
  google:
    client-id: "${GOOGLE_CLIENT_ID}"
    client-secret: "${GOOGLE_CLIENT_SECRET}"
    redirect-uris: "${GOOGLE_REDIRECT_URIS}"
  jwt:
    secret: "${JWT_SECRET}"
    issuer: belog
    access-token-expiration: 30m
    refresh-token-expiration: 14d
    refresh-cookie-secure: "${REFRESH_COOKIE_SECURE:true}"
    refresh-cookie-same-site: "${REFRESH_COOKIE_SAME_SITE:Lax}"

storage:
  s3:
    bucket: "${AWS_S3_BUCKET}"
    region: "${AWS_REGION:ap-northeast-2}"
    presign-expiration: 5m

group:
  invite:
    base-url: "${GROUP_INVITE_BASE_URL}"
