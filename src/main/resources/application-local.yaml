spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/belog?characterEncoding=UTF-8}"
    username: "${DB_USERNAME:belog}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: "${SERVER_PORT:8080}"
